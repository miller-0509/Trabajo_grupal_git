{% extends 'base.html' %}

{% block title %}Registrar Movimiento - Inventario D1{% endblock %}

{% block content %}
<h1>Registrar Movimiento</h1>

<form method="POST" class="form">
    <div class="form-group">
        <label for="producto_id">Producto:</label>
        <select id="producto_id" name="producto_id" required>
            <option value="">Seleccionar producto...</option>
            {% for producto in productos %}
                <option value="{{ producto.id }}" {{ 'selected' if producto_seleccionado == producto.id }}>
                    {{ producto.nombre }} (Stock: {{ producto.cantidad_stock }})
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="tipo">Tipo de Movimiento:</label>
        <select id="tipo" name="tipo" required>
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" min="1" required>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn">Registrar</button>
        <a href="{{ url_for('main.listar_movimientos') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
