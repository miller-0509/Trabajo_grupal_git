{% extends 'base.html' %}

{% block title %}Editar Usuario - Inventario D1{% endblock %}

{% block content %}
<h1>Editar Usuario: {{ usuario.username }}</h1>

<form method="POST" class="form" id="editar-usuario-form">
    <div class="form-group">
        <label for="username">Nombre de Usuario:</label>
        <input type="text" id="username" name="username"
               value="{{ usuario.username }}" required
               minlength="3" maxlength="80">
    </div>

    <div class="form-group">
        <label for="rol">Rol:</label>
        <select id="rol" name="rol" required>
            <option value="empleado" {{ 'selected' if usuario.rol == 'empleado' }}>Empleado</option>
            <option value="admin" {{ 'selected' if usuario.rol == 'admin' }}>Administrador</option>
        </select>
    </div>

    <div class="form-group">
        <label for="password">Nueva Contraseña <small>(dejar en blanco para no cambiar)</small>:</label>
        <input type="password" id="password" name="password"
               placeholder="Mínimo 6 caracteres si se cambia"
               minlength="6" autocomplete="new-password">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn" id="btn-guardar-usuario">Guardar Cambios</button>
        <a href="{{ url_for('main.listar_usuarios') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
